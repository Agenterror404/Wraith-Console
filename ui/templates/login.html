{% extends "base.html" %}
{% block title %}Wraith — Login{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="login" method="post" action="/login" autocomplete="on">
    <svg class="ghost" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M32 6C19 6 11 16 11 30v24c0 2 2 3 4 2l4-3 5 3c1 .7 2 .7 3 0l5-3 5 3c1 .7 2 .7 3 0l4 3c2 1 4 0 4-2V30C53 16 45 6 32 6Z" fill="#bd93f9" opacity=".92"/>
      <circle cx="25" cy="29" r="4" fill="#15161d"/><circle cx="40" cy="29" r="4" fill="#15161d"/>
      <circle cx="26" cy="28" r="1.3" fill="#8be9fd"/><circle cx="41" cy="28" r="1.3" fill="#8be9fd"/>
    </svg>
    <div class="wordmark" data-text="WRAITH">WRAITH</div>
    <div class="sub">console · authorized access only</div>
    <label for="user">Username</label>
    <input id="user" name="username" type="text" autocomplete="username" autofocus required>
    <label for="pw" class="pw-label">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">ENTER</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</div>
{% endblock %}
